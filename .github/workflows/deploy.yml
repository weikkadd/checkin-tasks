name: Deploy to Production

on:
  workflow_dispatch:
  # ⏸️ 已暂停 (需要恢复时取消注释)
  # push:
  #   branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run check

      - name: Build application
        run: bun run build
        env:
          VITE_APP_ID: ${{ secrets.VITE_APP_ID }}
          VITE_APP_TITLE: ${{ secrets.VITE_APP_TITLE }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OAUTH_SERVER_URL: ${{ secrets.OAUTH_SERVER_URL }}
          VITE_OAUTH_PORTAL_URL: ${{ secrets.VITE_OAUTH_PORTAL_URL }}

      - name: Deploy to Manus WebDev
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "部署到 Manus WebDev"
          echo "在 Manus 管理界面连接此 GitHub 仓库后，推送到 main 分支将自动触发部署"

      - name: Deploy to Railway (可选)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # 安装 Railway CLI
          npm install -g @railway/cli
          
          # 部署
          railway up \
            --service checkin-automation-panel \
            --environment production

      - name: Deploy to Render (可选)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          curl -X POST https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_API_KEY }}

      - name: Notify deployment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = context.job.status;
            console.log(`Deployment ${status}`);
